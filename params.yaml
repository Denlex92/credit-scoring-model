data:
  raw_path: data/raw/UCI_Credit_Card.csv
  processed_dir: data/processed
  validation_report: reports/data_validation.json

split:
  test_size: 0.2
  random_state: 42

train:
  experiment_name: Credit_Default_Prediction
  tracking_uri: sqlite:///mlflow.db
  registered_model_name: CreditDefaultModel
  model_path: models/credit_default_model.pkl
  meta_path: models/model_meta.json
  metrics_path: reports/metrics.json
  cv_folds: 3
  scoring: roc_auc
  random_state: 42
  # Эксперименты: алгоритм, включён ли Feature Engineering, способ поиска и сетка гиперпараметров.
  experiments:
    - name: logreg_raw
      model: logreg
      feature_engineering: false
      search: grid
      params:
        C: [0.01, 0.1, 1.0]
    - name: logreg_fe
      model: logreg
      feature_engineering: true
      search: grid
      params:
        C: [0.01, 0.1, 1.0]
    - name: logreg_fe_balanced
      model: logreg
      feature_engineering: true
      search: grid
      params:
        C: [0.01, 0.1, 1.0]
        class_weight: [balanced]
    - name: random_forest_fe
      model: random_forest
      feature_engineering: true
      search: random
      n_iter: 8
      params:
        n_estimators: [200, 400]
        max_depth: [6, 10, 14]
        min_samples_leaf: [5, 20, 50]
        max_features: [sqrt, 0.3]
    - name: gradient_boosting_fe
      model: gradient_boosting
      feature_engineering: true
      search: grid
      params:
        learning_rate: [0.05, 0.1]
        n_estimators: [150, 300]
        max_depth: [2, 3]
        subsample: [0.8]
    - name: hist_gradient_boosting_fe
      model: hist_gradient_boosting
      feature_engineering: true
      search: random
      n_iter: 10
      params:
        learning_rate: [0.03, 0.05, 0.1]
        max_leaf_nodes: [15, 31, 63]
        min_samples_leaf: [20, 50, 100]
        l2_regularization: [0.0, 1.0]

monitoring:
  api_url: http://localhost:8000
  n_samples: 500
  psi_bins: 10
  psi_warning: 0.1
  psi_alert: 0.25
  features: [LIMIT_BAL, AGE, PAY_0, BILL_AMT1, PAY_AMT1]
  report_path: reports/drift_report.json
