      size: 2803853
  train:
    cmd: python -m src.models.train
    deps:
    - path: data/processed/test.csv
      hash: md5
      md5: d34fc24fc9aee2862cd641529b24cc8d
      size: 701537
    - path: data/processed/train.csv
      hash: md5
      md5: 5f1975aa92c302debab6eb70f9810098
      size: 2803853
    - path: src/features/build_features.py
      hash: md5
      md5: 58c539dc9a8c78c056e38e00e5ebac18
      size: 2918
    - path: src/models/metrics.py
      hash: md5
      md5: 19e1ab5e9e42a5785d97a99bccb93248
      size: 3680
    - path: src/models/pipeline.py
      hash: md5
      md5: 4d3ca47c4c59a482e9e5601b069c24c0
      size: 2335
    - path: src/models/train.py
      hash: md5
      md5: 3d0f76193c44bed9de7a8f98751b5235
      size: 9357
    params:
      params.yaml:
        train:
          experiment_name: Credit_Default_Prediction
          tracking_uri: sqlite:///mlflow.db
          registered_model_name: CreditDefaultModel
          model_path: models/credit_default_model.pkl
          meta_path: models/model_meta.json
          metrics_path: reports/metrics.json
          cv_folds: 3
          scoring: roc_auc
          random_state: 42
          experiments:
          - name: logreg_raw
            model: logreg
            feature_engineering: false
            search: grid
            params:
              C:
              - 0.01
              - 0.1
              - 1.0
          - name: logreg_fe
            model: logreg
            feature_engineering: true
            search: grid
            params:
              C:
              - 0.01
              - 0.1
              - 1.0
          - name: logreg_fe_balanced
            model: logreg
            feature_engineering: true
            search: grid
            params:
              C:
              - 0.01
              - 0.1
              - 1.0
              class_weight:
              - balanced
          - name: random_forest_fe
            model: random_forest
            feature_engineering: true
            search: random
            n_iter: 8
            params:
              n_estimators:
              - 200
              - 400
              max_depth:
              - 6
              - 10
              - 14
              min_samples_leaf:
              - 5
              - 20
              - 50
              max_features:
              - sqrt
              - 0.3
          - name: gradient_boosting_fe
            model: gradient_boosting
            feature_engineering: true
            search: grid
            params:
              learning_rate:
              - 0.05
              - 0.1
              n_estimators:
              - 150
              - 300
              max_depth:
              - 2
              - 3
              subsample:
              - 0.8
          - name: hist_gradient_boosting_fe
            model: hist_gradient_boosting
            feature_engineering: true
            search: random
            n_iter: 10
            params:
              learning_rate:
              - 0.03
              - 0.05
              - 0.1
              max_leaf_nodes:
              - 15
              - 31
              - 63
              min_samples_leaf:
              - 20
              - 50
              - 100
              l2_regularization:
              - 0.0
              - 1.0
    outs:
    - path: models/credit_default_model.pkl
      hash: md5
      md5: eee54c8982b9f4a89a17c91802ad22a2
      size: 13065163
    - path: models/model_meta.json
